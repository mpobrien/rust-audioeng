[package]
name = "phogbank"
version = "0.1.0"
edition = "2024"

[lib]
name = "phogbank"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "phogbank"
path = "src/main.rs"

[dependencies]
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tree-sitter = "0.25"
cpal = "0.15"
ringbuf = "0.3"

[build-dependencies]
cc = "1.0"
